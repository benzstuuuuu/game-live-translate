name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # apple-vision's Swift bridge needs the macOS 26 SDK (MLMultiArrayDataType.int8).
      - name: Select Xcode 26
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          test -n "$XC" || { echo "no Xcode 26 on this image"; exit 1; }
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90"
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      # Without apple-translation: see the feature note in Cargo.toml.
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
      - run: cargo test --no-default-features
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Coverage (src/core/ must be >= 80% lines)
        run: |
          cargo llvm-cov --no-default-features --json --summary-only --output-path cov.json
          jq -e '
            [.data[0].files[] | select(.filename | test("/src/core/")) | .summary.lines]
            | (map(.covered) | add) / (map(.count) | add) * 100
            | "src/core line coverage: \(.)%" as $m | ($m | stderr) | . >= 80
          ' cov.json
