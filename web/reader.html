<!doctype html>
<!-- /reader: phone on the LAN. Prototype variant C (#25): one line fills the screen; history and controls in bottom sheets. -->
<html lang="th" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yokoten</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="tokens.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg-sunken); color: var(--text-primary); font-family: var(--font-sans); font-size: 16px; line-height: 28px; -webkit-text-size-adjust: 100%; }
  button { font: inherit; color: inherit; }
  .label { font-family: var(--font-mono); font-size: 12px; line-height: 18px; font-weight: 500; letter-spacing: .06em; color: var(--text-tertiary); }
  .dot { width: 8px; height: 8px; border-radius: 9999px; flex: none; background: var(--color-gray-400); }
  .dot.translating { background: var(--color-success-500); }
  .dot.error, .dot.offline { background: var(--color-error-500); }
  .icon-btn { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; padding: 0; border: 1px solid var(--border-subtle); border-radius: var(--radius-md); background: var(--bg-surface); color: var(--text-secondary); }
  .btn { min-height: 44px; padding: 0 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--border-strong); border-radius: var(--radius-md); background: var(--bg-page); font-weight: 500; }
  .btn-primary { border-color: transparent; background: var(--color-sky-500); color: var(--color-ink-900); }
  .page { height: 100dvh; display: flex; flex-direction: column; padding: 16px; padding-top: max(16px, env(safe-area-inset-top)); }
  header { display: flex; align-items: center; gap: 8px; }
  .profile { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  main { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 20px; padding-bottom: 64px; overflow: hidden; }
  .note { margin: 0; color: var(--text-tertiary); }
  .prev { margin: 0; font-size: 18px; line-height: 1.45; color: var(--text-disabled); }
  .th { margin: 0; font-family: var(--font-display); font-size: 40px; line-height: 1.3; font-weight: 600; letter-spacing: -.01em; }
  .en { margin: 0; font-size: 17px; line-height: 1.5; color: var(--text-secondary); }
  .offline-card { display: none; padding: 12px 16px; border: 1px solid var(--color-error-500); border-radius: var(--radius-lg); background: var(--color-error-100); color: var(--color-error-900); }
  .is-offline .offline-card { display: block; }
  .cause-card { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 12px 16px; border: 1px solid var(--color-error-500); border-radius: var(--radius-lg); background: var(--color-error-100); color: var(--color-error-900); }
  .fallback-card { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 12px 16px; border: 1px solid var(--color-warning-500); border-radius: var(--radius-lg); background: var(--color-warning-100); color: var(--color-warning-900); }
  .scrim { position: fixed; inset: 0; background: var(--scrim); }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 75dvh; display: flex; flex-direction: column; gap: 12px; padding: 16px 16px max(24px, env(safe-area-inset-bottom)); border-radius: 12px 12px 0 0; background: var(--bg-elevated); box-shadow: var(--shadow-lg); }
  .sheet h2 { margin: 0; font-size: 18px; }
  .history { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
  .history li { display: flex; flex-direction: column; gap: 2px; }
  .err { margin: 0; color: var(--color-error-500); font-size: 14px; line-height: 22px; }
  .seg { display: flex; gap: 8px; }
  .seg-btn { flex: 1; min-height: 44px; padding: 0 12px; border: 1px solid var(--border-strong); border-radius: var(--radius-md); background: var(--bg-page); color: var(--text-secondary); font-size: 15px; }
  .seg-btn[aria-pressed="true"] { border-color: var(--color-sky-500); background: var(--bg-accent); color: var(--text-primary); font-weight: 600; }
  .seg-btn:disabled { opacity: .5; }
  .new { animation: in var(--dur-slow) var(--ease-out); }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="page" id="page">
  <header>
    <span class="profile" id="profile"></span>
    <span style="flex:1"></span>
    <span style="display:inline-flex;align-items:center;gap:8px" aria-live="polite">
      <span class="dot offline" id="dot"></span><span class="label" id="status">กำลังเชื่อมต่อ</span>
    </span>
    <button type="button" class="icon-btn" aria-label="ประวัติ" data-sheet="history">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
    </button>
    <button type="button" class="icon-btn" aria-label="ควบคุม" data-sheet="controls">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
    </button>
  </header>
  <main aria-live="polite">
    <div class="offline-card" role="alert"><strong>ขาดการเชื่อมต่อ</strong><br>
      <span style="font-size:14px;line-height:22px">ต่อ Yokoten บน Mac ไม่ได้ · กำลังลองต่อใหม่เอง</span></div>
    <div class="cause-card" id="cause" role="alert" hidden>
      <strong id="cause-message"></strong>
      <span id="cause-fix" style="font-size:14px;line-height:22px"></span>
      <span id="cause-retry" style="font-size:14px;line-height:22px" hidden></span>
      <button type="button" class="btn btn-primary" id="retry">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>ลองอีกครั้ง</button>
      <p class="err" id="retry-err" hidden></p>
    </div>
    <!-- FR-TRN-05 (#37): Gemini failed or was slow, so lines come from Apple until it works again. -->
    <div class="fallback-card" id="fallback" role="status" hidden>
      <strong>ใช้ Apple ชั่วคราว</strong>
      <span id="fallback-reason" style="font-size:14px;line-height:22px"></span>
      <span id="fallback-note" style="font-size:14px;line-height:22px"></span>
      <button type="button" class="btn" id="fallback-retry">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>ลอง Gemini อีกครั้ง</button>
      <p class="err" id="fallback-err" hidden></p>
    </div>
    <p class="prev" id="prev" hidden></p>
    <div id="latest" style="display:flex;flex-direction:column;gap:12px" hidden>
      <p class="th" id="latest-th"></p><p class="en" id="latest-en"></p>
    </div>
    <p class="note" id="note"></p>
  </main>
</div>

<div id="sheet-wrap" hidden>
  <div class="scrim" data-sheet=""></div>
  <section class="sheet" role="dialog" aria-modal="true">
    <button type="button" class="icon-btn" aria-label="ปิด" data-sheet="" style="align-self:flex-end;border:0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
    <div id="sheet-history" hidden style="display:flex;flex-direction:column;gap:12px;min-height:0">
      <h2>ประวัติ session นี้</h2>
      <ol class="history" id="history"></ol>
    </div>
    <div id="sheet-controls" hidden style="display:flex;flex-direction:column;gap:12px">
      <h2>ควบคุม</h2>
      <!-- FR-WEB-03 / FR-GAME-08 (#38): pick only; creating profiles is on /setup. -->
      <span class="label" id="profiles-label">โปรไฟล์เกม</span>
      <div class="seg" id="profiles" role="group" aria-labelledby="profiles-label" style="flex-wrap:wrap"></div>
      <p class="note" id="profiles-hint" style="font-size:14px;line-height:22px" hidden>เปลี่ยนตอนกำลังแปลจะเริ่ม session ใหม่ทันที</p>
      <p class="err" id="profile-err" hidden></p>
      <span class="label" id="translators-label">ตัวแปล</span>
      <div class="seg" id="translators" role="group" aria-labelledby="translators-label"></div>
      <p class="err" id="translator-err" hidden></p>
      <button type="button" class="btn btn-primary" id="start">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"/></svg>เริ่มแปล</button>
      <button type="button" class="btn" id="stop">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>หยุดแปล</button>
      <p class="err" id="control-err" hidden></p>
    </div>
  </section>
</div>

<script src="app.js"></script>
<script src="reader-profiles.js"></script>
<script src="reader-fallback.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const ui = { online: false, state: null, lines: [], sheet: null };
const time = (ms) => new Date(ms).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });

function render() {
  const { online, state, lines, sheet } = ui;
  $('page').classList.toggle('is-offline', !online);
  const key = online && state ? state.status : 'offline';
  $('dot').className = `dot ${key}`;
  $('status').textContent = key === 'offline' ? 'ขาดการเชื่อมต่อ' : Yokoten.STATUS_LABEL[key];
  $('profile').textContent = state?.profile?.name ?? '';

  const latest = lines[lines.length - 1];
  const prev = lines[lines.length - 2];
  $('prev').hidden = !prev;
  $('prev').textContent = prev?.target_text ?? '';
  $('latest').hidden = !latest;
  if (latest && $('latest').dataset.id !== `${latest.id}:${latest.target_text}`) {
    $('latest').dataset.id = `${latest.id}:${latest.target_text}`;
    $('latest-th').textContent = latest.target_text;
    $('latest-en').textContent = latest.source_text;
    $('latest').classList.remove('new');
    void $('latest').offsetWidth;
    $('latest').classList.add('new');
  }
  // Cause card with one fix button while translating is stopped by a problem (FR-WEB-04).
  const problem = online && state?.status === 'error' ? state.error : null;
  $('cause').hidden = !problem;
  $('cause-message').textContent = problem?.message ?? '';
  $('cause-fix').textContent = problem?.fix ?? '';
  // FR-ERR-05, 06: OBS and card problems are tried again by the server.
  $('cause-retry').hidden = !problem?.retry_s;
  $('cause-retry').textContent = problem?.retry_s ? `แก้แล้วจะกลับมาแปลเอง · ลองใหม่ทุก ${problem.retry_s} วินาที` : '';
  $('note').hidden = !!latest || !!problem;
  $('note').textContent = state?.status === 'translating' ? 'รอบรรทัดแรก…' : 'เปิด “ควบคุม” แล้วกดเริ่มแปล';

  $('sheet-wrap').hidden = !sheet;
  $('sheet-history').hidden = sheet !== 'history';
  $('sheet-controls').hidden = sheet !== 'controls';
  if (sheet === 'history') {
    $('history').innerHTML = [...lines].reverse().map((l) => `<li><span style="font-size:18px;line-height:1.45">${Yokoten.esc(l.target_text)}</span><span style="font-size:13px;line-height:1.45;color:var(--text-tertiary)">${Yokoten.esc(l.source_text)} · ${time(l.created_at)}</span></li>`).join('');
  }
  // A session waiting out a problem is still on, so it can be stopped.
  const running = state?.status === 'translating' || !!state?.error?.retry_s;
  $('start').hidden = running;
  $('stop').hidden = !running;
  $('start').disabled = !online;
  $('stop').disabled = !online;
  if (sheet === 'controls') {
    $('translators').innerHTML = Yokoten.translatorButtons(state?.translator, !online);
    const err = state?.error?.code === 'translator_unavailable' ? state.error : null;
    $('translator-err').hidden = !err;
    $('translator-err').textContent = err ? `${err.message} · ${err.fix}` : '';
  }
}

// Reload the session's history (on a new session, or after a reconnect).
async function loadHistory() {
  try {
    const res = await fetch('/api/lines?limit=200');
    if (res.ok) ui.lines = (await res.json()).reverse();
  } catch { /* offline; the next state event retries */ }
  render();
}

async function command(path, errId = 'control-err') {
  $(errId).hidden = true;
  const res = await fetch(path, { method: 'POST' }).catch(() => null);
  if (!res?.ok) {
    const body = await res?.json().catch(() => null);
    $(errId).textContent = body?.error ?? 'สั่งงานไม่สำเร็จ ลองอีกครั้ง';
    $(errId).hidden = false;
    return;
  }
  ui.sheet = null;
  render();
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-sheet]');
  if (t) { ui.sheet = t.dataset.sheet || null; render(); }
});
// FR-TRN-02: the switch is app-wide; this page redraws from the next `state`.
document.addEventListener('click', async (e) => {
  const t = e.target.closest('[data-translator]');
  if (!t || t.getAttribute('aria-pressed') === 'true') return;
  $('control-err').hidden = true;
  const err = await Yokoten.setTranslator(t.dataset.translator);
  $('control-err').textContent = err ?? '';
  $('control-err').hidden = !err;
});
$('start').onclick = () => command('/api/start');
$('stop').onclick = () => command('/api/stop');
$('retry').onclick = () => command('/api/start', 'retry-err');

let wasOnline = false;
Yokoten.follow(
  {
    state: (s) => {
      const newSession = s.session_id !== ui.state?.session_id;
      ui.state = s;
      ui.online = true;
      if (newSession || !wasOnline) loadHistory();
      wasOnline = true;
      render();
    },
    // A line from a session that just ended (profile switch) is not this one's.
    line: (l) => { if (l.session_id !== ui.state?.session_id) return; ui.lines = [...ui.lines, l]; render(); },
    'line-updated': (l) => { ui.lines = ui.lines.map((x) => (x.id === l.id ? l : x)); render(); },
  },
  (up) => { ui.online = up; if (!up) wasOnline = false; render(); },
);
render();
</script>
</body>
</html>
