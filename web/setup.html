<!doctype html>
<!-- /setup: localhost only (FR-SET-08). One long page, checklist on top (prototype variant A, #25). Sections arrive with later slices. -->
<html lang="th" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yokoten · ตั้งค่า</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="tokens.css">
<style>
  body { margin: 0; background: var(--bg-page); color: var(--text-primary); font-family: var(--font-sans); font-size: 16px; line-height: 28px; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px; }
  .label { font-family: var(--font-mono); font-size: 12px; line-height: 18px; font-weight: 500; letter-spacing: .06em; color: var(--text-tertiary); }
  .card { display: flex; flex-direction: column; gap: 12px; padding: 16px; border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); background: var(--bg-surface); }
  .card h2 { margin: 0; }
  .seg { display: flex; gap: 8px; flex-wrap: wrap; }
  .seg-btn { min-height: 40px; padding: 0 16px; border: 1px solid var(--border-strong); border-radius: var(--radius-md); background: var(--bg-page); color: var(--text-secondary); font: inherit; font-size: 15px; cursor: pointer; }
  .seg-btn[aria-pressed="true"] { border-color: var(--color-sky-500); background: var(--bg-accent); color: var(--text-primary); font-weight: 600; }
  .seg-btn:disabled { opacity: .5; cursor: default; }
  .problem { display: flex; flex-direction: column; gap: 4px; padding: 12px 16px; border: 1px solid var(--color-error-500); border-radius: var(--radius-md); background: var(--color-error-100); color: var(--color-error-900); font-size: 14px; line-height: 22px; }
  .problem a { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; margin-top: 4px; color: inherit; font-weight: 600; }
  .err { margin: 0; color: var(--color-error-500); font-size: 14px; line-height: 22px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1 class="h1">ตั้งค่า Yokoten</h1>
  <p>สถานะ: <span class="label" id="status">กำลังเชื่อมต่อ</span> · โปรไฟล์: <strong id="profile"></strong></p>

  <!-- FR-TRN-02, 11: one translator for the whole app; /reader shows the same choice. -->
  <section class="card" aria-labelledby="translator-title">
    <h2 class="h4" id="translator-title">ตัวแปล</h2>
    <div class="seg" id="translators" role="group" aria-labelledby="translator-title"></div>
    <div class="problem" id="translator-problem" role="alert" hidden>
      <strong id="translator-message"></strong>
      <span id="translator-fix"></span>
      <a href="x-apple.systempreferences:com.apple.Localization-Settings.extension">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>เปิด Language &amp; Region ใน System Settings</a>
    </div>
    <p class="err" id="translator-err" hidden></p>
  </section>
</main>
<script src="app.js"></script>
<script>
const $ = (id) => document.getElementById(id);

function renderTranslator(s, online) {
  $('translators').innerHTML = Yokoten.translatorButtons(s?.translator, !online);
  const err = s?.error?.code === 'translator_unavailable' ? s.error : null;
  $('translator-problem').hidden = !err;
  $('translator-message').textContent = err?.message ?? '';
  $('translator-fix').textContent = err?.fix ?? '';
}

let last = null;
Yokoten.follow(
  {
    state: (s) => {
      last = s;
      $('status').textContent = Yokoten.STATUS_LABEL[s.status];
      $('profile').textContent = s.profile?.name ?? '';
      renderTranslator(s, true);
    },
  },
  (up) => {
    if (!up) $('status').textContent = 'ขาดการเชื่อมต่อ';
    renderTranslator(last, up);
  },
);

$('translators').addEventListener('click', async (e) => {
  const t = e.target.closest('[data-translator]');
  if (!t || t.getAttribute('aria-pressed') === 'true') return;
  const err = await Yokoten.setTranslator(t.dataset.translator);
  $('translator-err').textContent = err ?? '';
  $('translator-err').hidden = !err;
});
</script>
</body>
</html>
