[package]
name = "yokoten"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[dependencies]
apple-cf = { version = "=0.11.7", default-features = false, features = ["cv"] }
apple-vision = "=0.17.2"
axum = "0.8"
base64 = "0.22"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
objc2 = "0.6"
obws = "=0.15.0"
qrcode = { version = "0.14", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
rust-embed = { version = "8", features = ["mime-guess"] }
security-framework = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
# Live Translate WebSocket; the same crate obws already pulls in.
tokio-websockets = { version = "=0.13.3", features = ["client", "fastrand", "sha1_smol", "native-tls"] }
translation-rs = { version = "=0.5.2", optional = true }
uuid = { version = "1", features = ["v4"] }

# Real Apple Translation; its own main spins the run loop (see the file).
[features]
default = ["apple-translation"]
# Apple Translation needs the macOS 26.4+ SDK (TranslationSession.Strategy);
# GitHub's runners top out at Xcode 26.3, so CI builds without it.
apple-translation = ["dep:translation-rs"]

[[test]]
name = "apple_translation"
harness = false
required-features = ["apple-translation"]

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
# Fake Live Translate server in tests/live.rs.
tokio-websockets = { version = "=0.13.3", features = ["server"] }
# Paused time in tests/live.rs (the 3 s wait before the bar hides).
tokio = { version = "1", features = ["test-util"] }
